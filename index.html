<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuestro Universo 💙</title>

<style>
body{
    margin:0;
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(to bottom,#000010,#020225,#06063f);
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

.estrellas{
    position:absolute;
    width:100%;
    height:100%;
}

.estrella{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    animation:brillar 2s infinite alternate;
}

@keyframes brillar{
    from{opacity:0.3;}
    to{opacity:1;}
}

.contenido{
    z-index:10;
}

h1{
    font-size:60px;
    margin-bottom:20px;
}

p{
    font-size:22px;
}

button{
    margin-top:20px;
    padding:15px 30px;
    border:none;
    border-radius:30px;
    background:#5f7cff;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    transform:scale(1.05);
}
</style>
</head>

<body>

<div class="estrellas" id="estrellas"></div>

<div class="contenido">
<h1>🌌 Nuestro Universo</h1>

<p>
Aunque nos separen miles de kilómetros,
seguimos orbitando el mismo universo.
💙
</p>

<button onclick="alert('Bienvenido a nuestro viaje por las estrellas ✨')">
🚀 Comenzar viaje
</button>
</div>

<script>
const contenedor=document.getElementById("estrellas");

for(let i=0;i<250;i++){
let estrella=document.createElement("div");
estrella.className="estrella";
estrella.style.left=Math.random()*100+"%";
estrella.style.top=Math.random()*100+"%";
contenedor.appendChild(estrella);
}
</script>

</body>
</html>
